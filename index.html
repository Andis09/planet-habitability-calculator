<!DOCTYPE html>
<html>
<head>
    <title>Planet Habitability Calculator</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div id="planetBackground"></div>

    <div class="app-container">
        <h1>Planet Habitability Score Calculator</h1>
        <p class="subtitle">Select a planet or enter custom values</p>

        <label>Select a Planet:</label>
        <select id="planetSelect" onchange="loadPlanet()">
            <option value="">Choose a planet</option>
            <option value="custom">Custom Planet</option>
            <option value="mercury">Mercury</option>
            <option value="venus">Venus</option>
            <option value="earth">Earth</option>
            <option value="mars">Mars</option>
            <option value="jupiter">Jupiter</option>
            <option value="saturn">Saturn</option>
            <option value="uranus">Uranus</option>
            <option value="neptune">Neptune</option>
        </select>

        <label>Distance from Star (AU):</label>
        <input type="number" id="distance" placeholder="Example: 1">

        <label>Surface Temperature (K):</label>
        <input type="number" id="temp" placeholder="Example: 288">

        <label>Planet Mass (Earth = 1):</label>
        <input type="number" id="mass" placeholder="Example: 1">

        <label>Orbital Eccentricity:</label>
        <input type="number" id="ecc" step="0.01" placeholder="Example: 0.02">

        <label>Atmosphere:</label>
        <select id="atm">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <button onclick="calculateHabitability()">Calculate Score</button>
        <button onclick="resetFields()">Reset</button>

        <h2 id="result">Habitability Score: --</h2>
        <p id="rating"></p>

        <div id="breakdown"></div>
        <div id="explanation"></div>

        <canvas id="scoreChart"></canvas>
    </div>
</body>
</html>
